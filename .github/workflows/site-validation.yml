name: Validate website

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check deterministic generated pages
        run: python3 scripts/build.py --check
      - name: Check curated pages and local resources
        run: python3 scripts/validate_site.py
      - name: Check release helper syntax
        run: node --check release-meta.js
